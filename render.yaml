# Render Blueprint. Secrets (MONGO_URI, SMTP_*) stay in the dashboard — sync: false.
# This workspace already has a free web service (navgo-api). A second free
# instance may be rejected; use starter if so.
services:
  - type: web
    name: talerole-api
    runtime: go
    plan: free
    region: frankfurt
    buildCommand: cd apps/api && go build -tags netgo -ldflags "-s -w" -o ../../talerole-server ./cmd/server
    startCommand: ./talerole-server
    healthCheckPath: /health/ready
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://talerole.com,https://www.talerole.com,https://admin.talerole.com
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_DB
        value: talerole
      - key: SMTP_FROM
        value: Tale Role <noreply@talerole.com>
      - key: SMTP_PORT
        value: "587"
      - key: MONGO_URI
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Tale Role <onboarding@resend.dev>
