services:
  mongo:
    image: mongo:7
    container_name: talerole-mongo
    ports:
      - "27017:27017"
    volumes:
      - talerole-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: talerole-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  talerole-mongo:
