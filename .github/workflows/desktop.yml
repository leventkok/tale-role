name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

env:
  DESKTOP_VERSION: 0.1.${{ github.run_number }}

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Pack Windows installer
        working-directory: apps/desktop
        run: |
          npm ci
          npm version $env:DESKTOP_VERSION --no-git-tag-version --allow-same-version
          npm run pack:win
        env:
          DESKTOP_VERSION: ${{ env.DESKTOP_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: |
            apps/desktop/dist/Tale-Role-Setup.exe
            apps/desktop/dist/latest.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Pack macOS installer
        working-directory: apps/desktop
        run: |
          npm ci
          npm version "$DESKTOP_VERSION" --no-git-tag-version --allow-same-version
          npm run pack:mac
        env:
          DESKTOP_VERSION: ${{ env.DESKTOP_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            apps/desktop/dist/Tale-Role.dmg
            apps/desktop/dist/latest-mac.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error

  release:
    needs: [build-win, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: win-installer
          path: dist/win
      - uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: dist/mac
      - name: Stage release files
        run: |
          cp dist/win/* .
          cp dist/mac/* .
          ls -lh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.DESKTOP_VERSION }}
          name: Tale Role Desktop v${{ env.DESKTOP_VERSION }}
          files: |
            Tale-Role-Setup.exe
            Tale-Role-Setup.exe.blockmap
            latest.yml
            Tale-Role.dmg
            latest-mac.yml
          make_latest: true
          generate_release_notes: true
