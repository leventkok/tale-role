name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    name: Go API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "1.23"
          cache-dependency-path: apps/api/go.sum
      - run: go test ./...
      - run: go vet ./...

  gateway:
    name: LLM gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/llm-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "1.23"
          cache-dependency-path: services/llm-gateway/go.sum
      - run: go test ./...
      - run: go vet ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @tale-role/web
      - run: npm run typecheck -w @tale-role/admin
      - name: Build Next.js apps
        env:
          API_URL: http://127.0.0.1:8080
        run: |
          npm run build -w @tale-role/web
          npm run build -w @tale-role/admin

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: npm audit (high+)
        continue-on-error: true
        run: npm audit --audit-level=high

  ci-ok:
    name: CI gate
    if: always()
    needs: [packages, gitleaks, go, gateway, web]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require green jobs
        run: |
          echo "packages=${{ needs.packages.result }}"
          echo "gitleaks=${{ needs.gitleaks.result }}"
          echo "go=${{ needs.go.result }}"
          echo "gateway=${{ needs.gateway.result }}"
          echo "web=${{ needs.web.result }}"
          for result in "${{ needs.packages.result }}" "${{ needs.gitleaks.result }}" "${{ needs.go.result }}" "${{ needs.gateway.result }}" "${{ needs.web.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Required job failed: $result"
              exit 1
            fi
          done
