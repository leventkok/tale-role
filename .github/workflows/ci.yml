name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: npm audit (high+)
        continue-on-error: true
        run: npm audit --audit-level=high

  ci-ok:
    name: CI gate
    if: always()
    needs: [packages, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require green jobs
        run: |
          echo "packages=${{ needs.packages.result }}"
          echo "gitleaks=${{ needs.gitleaks.result }}"
          for result in "${{ needs.packages.result }}" "${{ needs.gitleaks.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Required job failed: $result"
              exit 1
            fi
          done
